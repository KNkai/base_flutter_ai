name: base_flutter_ai
description: "A production-grade Flutter + AI Engineering Starter Kit with GetX, Dio, and Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  get: ^4.7.2

  # Networking
  dio: ^5.7.0

  # Storage & Persistence
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Serialization & Utilities
  json_annotation: ^4.12.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

  # Testing Mocks
  mockito: ^5.4.4

flutter:
  uses-material-design: true
